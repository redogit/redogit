name: Probe Actions token name

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-actions-token-name.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Secret PAGES_ADMIN_TOKEN
        if: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}
        run: echo "FOUND_SECRET_NAME=PAGES_ADMIN_TOKEN"
      - name: Secret PAGES_TOKEN
        if: ${{ secrets.PAGES_TOKEN != '' }}
        run: echo "FOUND_SECRET_NAME=PAGES_TOKEN"
