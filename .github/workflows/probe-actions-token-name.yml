name: Probe Actions token name

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-actions-token-name.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List Actions secret names only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh secret list --app actions --repo "$GITHUB_REPOSITORY"
