name: Probe Actions token name

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-actions-token-name.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PAGES_ADMIN_TOKEN
        env:
          CANDIDATE: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=PAGES_ADMIN_TOKEN"; fi
      - name: Probe PAGES_TOKEN
        env:
          CANDIDATE: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=PAGES_TOKEN"; fi
      - name: Probe PAGES_PAT
        env:
          CANDIDATE: ${{ secrets.PAGES_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=PAGES_PAT"; fi
      - name: Probe GH_PAGES_TOKEN
        env:
          CANDIDATE: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GH_PAGES_TOKEN"; fi
      - name: Probe GH_PAGES_PAT
        env:
          CANDIDATE: ${{ secrets.GH_PAGES_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GH_PAGES_PAT"; fi
      - name: Probe GITHUB_PAGES_TOKEN
        env:
          CANDIDATE: ${{ secrets.GITHUB_PAGES_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GITHUB_PAGES_TOKEN"; fi
      - name: Probe GITHUB_PAGES_PAT
        env:
          CANDIDATE: ${{ secrets.GITHUB_PAGES_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GITHUB_PAGES_PAT"; fi
      - name: Probe ADMIN_TOKEN
        env:
          CANDIDATE: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=ADMIN_TOKEN"; fi
      - name: Probe ADMIN_PAT
        env:
          CANDIDATE: ${{ secrets.ADMIN_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=ADMIN_PAT"; fi
      - name: Probe GH_PAT
        env:
          CANDIDATE: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GH_PAT"; fi
      - name: Probe PAT
        env:
          CANDIDATE: ${{ secrets.PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=PAT"; fi
      - name: Probe PAT_TOKEN
        env:
          CANDIDATE: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=PAT_TOKEN"; fi
      - name: Probe TOKEN
        env:
          CANDIDATE: ${{ secrets.TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=TOKEN"; fi
      - name: Probe ACCESS_TOKEN
        env:
          CANDIDATE: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=ACCESS_TOKEN"; fi
      - name: Probe PERSONAL_ACCESS_TOKEN
        env:
          CANDIDATE: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=PERSONAL_ACCESS_TOKEN"; fi
      - name: Probe GIT_TOKEN
        env:
          CANDIDATE: ${{ secrets.GIT_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GIT_TOKEN"; fi
      - name: Probe GITHUB_ACCESS_TOKEN
        env:
          CANDIDATE: ${{ secrets.GITHUB_ACCESS_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GITHUB_ACCESS_TOKEN"; fi
      - name: Probe CODEX_TOKEN
        env:
          CANDIDATE: ${{ secrets.CODEX_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=CODEX_TOKEN"; fi
      - name: Probe CODEX_PAT
        env:
          CANDIDATE: ${{ secrets.CODEX_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=CODEX_PAT"; fi
      - name: Probe CODEX_GITHUB_TOKEN
        env:
          CANDIDATE: ${{ secrets.CODEX_GITHUB_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=CODEX_GITHUB_TOKEN"; fi
      - name: Probe CODEX_GITHUB_PAT
        env:
          CANDIDATE: ${{ secrets.CODEX_GITHUB_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=CODEX_GITHUB_PAT"; fi
      - name: Probe ACTIONS_TOKEN
        env:
          CANDIDATE: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=ACTIONS_TOKEN"; fi
      - name: Probe ACTIONS_PAT
        env:
          CANDIDATE: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=ACTIONS_PAT"; fi
      - name: Probe GH_ADMIN_TOKEN
        env:
          CANDIDATE: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GH_ADMIN_TOKEN"; fi
      - name: Probe GH_ADMIN_PAT
        env:
          CANDIDATE: ${{ secrets.GH_ADMIN_PAT }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GH_ADMIN_PAT"; fi
      - name: Probe GITHUB_API_TOKEN
        env:
          CANDIDATE: ${{ secrets.GITHUB_API_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=GITHUB_API_TOKEN"; fi
      - name: Probe API_TOKEN
        env:
          CANDIDATE: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=API_TOKEN"; fi
      - name: Probe REPO_TOKEN
        env:
          CANDIDATE: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=REPO_TOKEN"; fi
      - name: Probe REPOSITORY_TOKEN
        env:
          CANDIDATE: ${{ secrets.REPOSITORY_TOKEN }}
        run: |
          if [ -n "$CANDIDATE" ]; then echo "FOUND_SECRET_NAME=REPOSITORY_TOKEN"; fi
