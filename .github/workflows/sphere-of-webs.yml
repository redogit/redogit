name: Sphere of Webs Checks

on:
  push:
    branches: [main]
    paths:
      - 'sphere-of-webs/**'
      - 'tools/sphere_of_webs.py'
      - 'tests/test_sphere_of_webs.py'
      - 'CONTINUITY_SUCCESSORS_2026-09-30.md'
      - '.github/workflows/sphere-of-webs.yml'
  pull_request:
    paths:
      - 'sphere-of-webs/**'
      - 'tools/sphere_of_webs.py'
      - 'tests/test_sphere_of_webs.py'
      - 'CONTINUITY_SUCCESSORS_2026-09-30.md'
      - '.github/workflows/sphere-of-webs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sphere-of-webs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERIFY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact public verification commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"

      - name: Run sphere counterprobes and exact reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_sphere_of_webs -v
          python3 tools/sphere_of_webs.py validate sphere-of-webs/pr52-continuity-successor-2026-09-30.json
          python3 tools/sphere_of_webs.py restore sphere-of-webs/pr52-continuity-successor-2026-09-30.json > "$RUNNER_TEMP/pr52-trail.txt"
          python3 - "$RUNNER_TEMP/pr52-trail.txt" <<'PY'
          from pathlib import Path
          import sys

          expected = (
              "Word Carrier native occurrence\n"
              "-> native AnyInvocation export\n"
              "-> AnyFunctor / Decision Field\n"
              "-> continuity receipt\n"
              "-> Orbit Reflow persistence/retrieval\n"
              "-> Homeward\n"
          )
          assert Path(sys.argv[1]).read_text(encoding="utf-8") == expected
          PY
          git diff --exit-code
