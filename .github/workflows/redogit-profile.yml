name: REDOGIT profile

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'REDOGIT.md'
      - 'REDOGIT.schema.json'
      - 'redogit.json'
      - 'index.html'
      - 'tools/redogit.py'
      - '.github/workflows/redogit-profile.yml'
      - '.github/workflows/verify-redogit.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'REDOGIT.md'
      - 'REDOGIT.schema.json'
      - 'redogit.json'
      - 'index.html'
      - 'tools/redogit.py'
      - '.github/workflows/redogit-profile.yml'
      - '.github/workflows/verify-redogit.yml'

permissions:
  contents: read

jobs:
  contract:
    uses: ./.github/workflows/verify-redogit.yml

  surface:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check schema, homepage, and local CLI
        run: |
          python3 -m py_compile tools/redogit.py
          python3 tools/redogit.py check .
          python3 tools/redogit.py status .
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          schema = json.loads(Path('REDOGIT.schema.json').read_text(encoding='utf-8'))
          assert schema['title'] == 'REDOGIT repository contract'

          class Parser(HTMLParser):
              pass

          Parser().feed(Path('index.html').read_text(encoding='utf-8'))
          print('PASS - REDOGIT schema and homepage parse')
          PY
