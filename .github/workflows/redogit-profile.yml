name: REDOGIT profile

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'REDOGIT.md'
      - 'REDOGIT.schema.json'
      - 'redogit.json'
      - 'PUBLIC_STATUS.json'
      - 'index.html'
      - 'WORK_INDEX.md'
      - 'LIBRARIES_OF_LIBRARIES_*.md'
      - 'BIDIRECTIONAL_HANDOFF_PROTOCOL_*.md'
      - 'BIDIRECTIONAL_HANDOFF_PROTOCOL_*.json'
      - 'libraries-of-libraries.rmal'
      - 'tools/redogit.py'
      - '.github/workflows/redogit-profile.yml'
      - '.github/workflows/verify-redogit.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'REDOGIT.md'
      - 'REDOGIT.schema.json'
      - 'redogit.json'
      - 'PUBLIC_STATUS.json'
      - 'index.html'
      - 'WORK_INDEX.md'
      - 'LIBRARIES_OF_LIBRARIES_*.md'
      - 'BIDIRECTIONAL_HANDOFF_PROTOCOL_*.md'
      - 'BIDIRECTIONAL_HANDOFF_PROTOCOL_*.json'
      - 'libraries-of-libraries.rmal'
      - 'tools/redogit.py'
      - '.github/workflows/redogit-profile.yml'
      - '.github/workflows/verify-redogit.yml'

permissions:
  contents: read

jobs:
  contract:
    uses: ./.github/workflows/verify-redogit.yml

  surface:
    needs: contract
    runs-on: ubuntu-latest
    env:
      VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact commit without external Actions
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - name: Check schema, public status, homepage, and local CLI
        run: |
          python3 -m py_compile tools/redogit.py
          python3 tools/redogit.py check .
          python3 tools/redogit.py status .
          python3 tools/redogit.py public-status .
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          schema = json.loads(Path('REDOGIT.schema.json').read_text(encoding='utf-8'))
          assert schema['title'] == 'REDOGIT repository contract'

          status = json.loads(Path('PUBLIC_STATUS.json').read_text(encoding='utf-8'))
          assert status['schema'] == 'redogit/public-status/v1'
          assert status['scope'] == 'public repositories only'
          assert status['public_contracts_green'] is True

          expected_public = {
              'redogit/redogit',
              'redogit/conscience64',
              'redogit/MauiBrickBreak',
              'redogit/FirstNeuralNetwork',
              'redogit/orbit',
              'redogit/Dream-To-Action',
              'redogit/Other-Projects-',
          }
          entries = {entry['repository']: entry for entry in status['repositories']}
          assert set(entries) == expected_public

          for name, entry in entries.items():
              verification = entry['verification']
              if name == 'redogit/orbit':
                  assert verification['provenance_contract']['conclusion'] == 'success'
                  baseline = verification['verified_predecessor_baseline']
                  assert baseline['windows_conclusion'] == 'success'
                  assert baseline['macos_conclusion'] == 'success'
              else:
                  assert verification['conclusion'] == 'success'

          class Parser(HTMLParser):
              pass

          Parser().feed(Path('index.html').read_text(encoding='utf-8'))

          parity_marker = 'Conscience64PrivateCarrierSuccessor_2026_09_20'
          required_anchors = {
              'PR161': 'e10db6cccfd03106adef955297917408913ee339',
              'PR164': '83b37a5b31e4d45ada6b5033fb69a3617a6c2b5b',
              'PR165': 'eaee7b9051cbea795e3bf9f9b8eb8da9f81849d5',
              'PR169': '093af636098498ce84d6fe94c6a076bb745c048b',
              'PR170': '1cbf372207674070332b455c8851ee7993d6cf81',
          }
          required_boundaries = {
              'FEDERATION_REFERENCE != CONSCIENCE64_IMPLEMENTATION_AUTHORITY',
              'RMADAY_DESIGN != RUNTIME_IMPLEMENTATION',
              'REFERENCE != EVIDENCE_TRANSFER',
              'PRIVATE SOURCE MUST NOT PROPAGATE',
          }
          parity_surfaces = {
              'libraries-of-libraries.rmal': Path('libraries-of-libraries.rmal').read_text(encoding='utf-8'),
              'LIBRARIES_OF_LIBRARIES_RMAL_BUILD_2026-09-19.md': Path('LIBRARIES_OF_LIBRARIES_RMAL_BUILD_2026-09-19.md').read_text(encoding='utf-8'),
          }
          for surface_name, surface_text in parity_surfaces.items():
              assert parity_marker in surface_text, f'{surface_name} missing private-carrier successor marker'
              for label, anchor in required_anchors.items():
                  assert anchor in surface_text, f'{surface_name} missing {label} anchor {anchor}'
              for boundary in required_boundaries:
                  assert boundary in surface_text, f'{surface_name} missing boundary: {boundary}'

          bidirectional = json.loads(Path('BIDIRECTIONAL_HANDOFF_PROTOCOL_2026-09-20.json').read_text(encoding='utf-8'))
          assert bidirectional['schema'] == 'redogit/bidirectional-handoff-pairity/v1'
          assert bidirectional['directions'] == ['A_TO_B', 'B_TO_A']
          assert set(bidirectional['statuses']) == {'ACCEPTED', 'REJECTED', 'NEEDS_EVIDENCE', 'UNRESOLVED'}
          assert bidirectional['cross_write_default'] == 'DENY'
          assert bidirectional['evidence_transfer_default'] == 'DENY'
          assert bidirectional['target_local_successor_required'] is True
          assert bidirectional['privacy_rule'] == 'MONOTONIC_UNLESS_INDEPENDENTLY_REGROUNDED_BY_TARGET'
          assert bidirectional['counterproposal_rule'] == 'NEW_HANDOFF_ID'

          required_request = {
              'handoff_id','from','to','subject_uid','goal','obligation','request_class',
              'requested_action','source_refs','evidence_refs','privacy','claim_ceiling',
              'unresolved','way_back'
          }
          required_response = {
              'response_id','in_reply_to','from','to','status','decision_reason',
              'successor_refs','evidence_refs','unresolved','privacy','claim_ceiling','way_back'
          }
          assert set(bidirectional['request_fields']) == required_request
          assert set(bidirectional['response_fields']) == required_response

          bidirectional_boundaries = set(bidirectional['boundaries'])
          for boundary in {
              'REQUEST != COMMAND',
              'RESPONSE != AUTHORITY_TRANSFER',
              'ACCEPTED != VERIFIED',
              'REFERENCE != EVIDENCE_TRANSFER',
              'PRIVATE SOURCE MUST NOT PROPAGATE',
              'AUTHORIZED READ != PUBLICATION PERMISSION',
          }:
              assert boundary in bidirectional_boundaries

          adapters = bidirectional['current_adapters']
          assert adapters['redogit/conscience64']['evidence_anchor'] == '1cbf372207674070332b455c8851ee7993d6cf81'
          assert adapters['redogit/conscience64']['outward_privacy_anchor'] == 'deba0e9b19ef1fe106ba6dea1323eb0896dd5010'
          assert adapters['redogit/conscience64']['response_runtime_anchor'] == 'ee740af81d95533c907a65166564e661807c50eb'
          assert adapters['redogit/conscience64']['request_class'] == 'PRIVATE_METHOD_HANDOFF'
          assert adapters['redogit/conscience64']['request_identity'] == 'KNOWLEDGE_PACKET_UOID'
          assert adapters['redogit/conscience64']['response_schema'] == 'conscience64.handoff-response/v1'
          assert adapters['redogit/conscience64']['structured_response_packet_runtime'] is True
          assert adapters['redogit/conscience64']['generic_response_packet_runtime'] is False
          assert adapters['redogit/conscience64']['adapter_declaration_anchor'] == '731b6040d6b342cea423d402ec2fb6c1e5ad59a9'
          assert adapters['redogit/Other-Projects-']['evidence_anchor'] == 'f93f056a33d5fad0f29b763a0d49c6b79eb18d49'
          assert adapters['redogit/Other-Projects-']['adapter_declaration_anchor'] == '8de91a93347aaff1ff039a4899fd56eec6689da3'
          assert adapters['redogit/redogit']['evidence_anchor'] == 'a5ed5a4dac556fe718af358dd9a2b11266a88857'

          for path in ['LIBRARIES_OF_LIBRARIES_RMAL_BUILD_2026-09-19.md', 'libraries-of-libraries.rmal']:
              text = Path(path).read_text(encoding='utf-8')
              assert 'BidirectionalHandoffPairity_2026_09_20' in text
              assert 'LIBRARIES_OF_LIBRARIES_REFERENCE != TARGET_IMPLEMENTATION_AUTHORITY' in text
              assert 'Conscience64PrivateMethodStructuredReturn_2026_09_20' in text
              assert 'ee740af81d95533c907a65166564e661807c50eb' in text
              assert 'STRUCTURED_RETURN_PATH != UNIVERSAL_BIDIRECTIONAL_RUNTIME' in text
              assert 'Conscience64PublicTestbedProjection_2026_09_20' in text
              assert 'f05fc0550ba0e945ea64e9b8447b972b1c4a11fd' in text
              assert 'PUBLIC_TESTBED != WHOLE_REPOSITORY' in text
              assert 'PUBLIC_EXPERIMENT != VERIFIED_TRUTH' in text

          print('PASS - REDOGIT schema, public status, homepage, CLI, public/private boundary, and Conscience64 private-carrier reference parity and bidirectional handoff Pairity')
          PY
