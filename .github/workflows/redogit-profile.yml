name: REDOGIT profile

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'REDOGIT.md'
      - 'REDOGIT.schema.json'
      - 'redogit.json'
      - 'PUBLIC_STATUS.json'
      - 'index.html'
      - 'WORK_INDEX.md'
      - 'LIBRARIES_OF_LIBRARIES_*.md'
      - 'libraries-of-libraries.rmal'
      - 'tools/redogit.py'
      - '.github/workflows/redogit-profile.yml'
      - '.github/workflows/verify-redogit.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'REDOGIT.md'
      - 'REDOGIT.schema.json'
      - 'redogit.json'
      - 'PUBLIC_STATUS.json'
      - 'index.html'
      - 'WORK_INDEX.md'
      - 'LIBRARIES_OF_LIBRARIES_*.md'
      - 'libraries-of-libraries.rmal'
      - 'tools/redogit.py'
      - '.github/workflows/redogit-profile.yml'
      - '.github/workflows/verify-redogit.yml'

permissions:
  contents: read

jobs:
  contract:
    uses: ./.github/workflows/verify-redogit.yml

  surface:
    needs: contract
    runs-on: ubuntu-latest
    env:
      VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact commit without external Actions
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - name: Check schema, public status, homepage, and local CLI
        run: |
          python3 -m py_compile tools/redogit.py
          python3 tools/redogit.py check .
          python3 tools/redogit.py status .
          python3 tools/redogit.py public-status .
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          schema = json.loads(Path('REDOGIT.schema.json').read_text(encoding='utf-8'))
          assert schema['title'] == 'REDOGIT repository contract'

          status = json.loads(Path('PUBLIC_STATUS.json').read_text(encoding='utf-8'))
          assert status['schema'] == 'redogit/public-status/v1'
          assert status['scope'] == 'public repositories only'
          assert status['public_contracts_green'] is True

          expected_public = {
              'redogit/redogit',
              'redogit/conscience64',
              'redogit/MauiBrickBreak',
              'redogit/FirstNeuralNetwork',
              'redogit/orbit',
              'redogit/Dream-To-Action',
              'redogit/Other-Projects-',
          }
          entries = {entry['repository']: entry for entry in status['repositories']}
          assert set(entries) == expected_public

          for name, entry in entries.items():
              verification = entry['verification']
              if name == 'redogit/orbit':
                  assert verification['provenance_contract']['conclusion'] == 'success'
                  baseline = verification['verified_predecessor_baseline']
                  assert baseline['windows_conclusion'] == 'success'
                  assert baseline['macos_conclusion'] == 'success'
              else:
                  assert verification['conclusion'] == 'success'

          class Parser(HTMLParser):
              pass

          Parser().feed(Path('index.html').read_text(encoding='utf-8'))

          parity_marker = 'Conscience64PrivateCarrierSuccessor_2026_09_20'
          required_anchors = {
              'PR161': 'e10db6cccfd03106adef955297917408913ee339',
              'PR164': '83b37a5b31e4d45ada6b5033fb69a3617a6c2b5b',
              'PR165': 'eaee7b9051cbea795e3bf9f9b8eb8da9f81849d5',
              'PR169': '093af636098498ce84d6fe94c6a076bb745c048b',
              'PR170': '1cbf372207674070332b455c8851ee7993d6cf81',
          }
          required_boundaries = {
              'FEDERATION_REFERENCE != CONSCIENCE64_IMPLEMENTATION_AUTHORITY',
              'RMADAY_DESIGN != RUNTIME_IMPLEMENTATION',
              'REFERENCE != EVIDENCE_TRANSFER',
              'PRIVATE SOURCE MUST NOT PROPAGATE',
          }
          parity_surfaces = {
              'libraries-of-libraries.rmal': Path('libraries-of-libraries.rmal').read_text(encoding='utf-8'),
              'LIBRARIES_OF_LIBRARIES_RMAL_BUILD_2026-09-19.md': Path('LIBRARIES_OF_LIBRARIES_RMAL_BUILD_2026-09-19.md').read_text(encoding='utf-8'),
          }
          for surface_name, surface_text in parity_surfaces.items():
              assert parity_marker in surface_text, f'{surface_name} missing private-carrier successor marker'
              for label, anchor in required_anchors.items():
                  assert anchor in surface_text, f'{surface_name} missing {label} anchor {anchor}'
              for boundary in required_boundaries:
                  assert boundary in surface_text, f'{surface_name} missing boundary: {boundary}'

          print('PASS - REDOGIT schema, public status, homepage, CLI, public/private boundary, and Conscience64 private-carrier reference parity')
          PY
