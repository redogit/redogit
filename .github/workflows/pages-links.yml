name: Verify public Pages graph

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/index.html'
      - 'tools/check_public_pages.py'
      - '.github/workflows/pages-links.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages-graph
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify live hub and child Pages
        run: python3 tools/check_public_pages.py
