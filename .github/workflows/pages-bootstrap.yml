name: Bootstrap GitHub Pages sites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap_github_pages.py'
      - '.github/workflows/pages-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Require Pages administration token
        env:
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: |
          test -n "$PAGES_ADMIN_TOKEN" || {
            echo "PAGES_ADMIN_TOKEN is required."
            echo "Use a token with Pages(write) + Administration(write) for the target repositories."
            exit 1
          }
      - name: GET existing sites and POST only missing sites
        env:
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: python3 tools/bootstrap_github_pages.py | tee pages-bootstrap.json
      - name: Upload bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-bootstrap
          path: pages-bootstrap.json
