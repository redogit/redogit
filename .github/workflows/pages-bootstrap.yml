name: Bootstrap GitHub Pages sites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap_github_pages.py'
      - '.github/workflows/pages-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: GET existing sites and POST only missing sites
        env:
          PRIMARY_PAGES_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          ALTERNATE_PAGES_TOKEN: ${{ secrets.PAGE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          token="$PRIMARY_PAGES_TOKEN"
          if [ -z "$token" ]; then token="$ALTERNATE_PAGES_TOKEN"; fi
          test -n "$token" || {
            echo "Neither PAGES_ADMIN_TOKEN nor PAGE_ADMIN_TOKEN is visible to this workflow."
            exit 1
          }
          PAGES_ADMIN_TOKEN="$token" python3 tools/bootstrap_github_pages.py | tee pages-bootstrap.json
      - name: Upload bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-bootstrap
          path: pages-bootstrap.json
