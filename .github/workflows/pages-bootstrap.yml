name: Bootstrap GitHub Pages sites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap_github_pages.py'
      - '.github/workflows/pages-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: GET existing sites and POST only missing sites
        env:
          PAGES_ADMIN_TOKEN_1: ${{ secrets.PAGES_ADMIN_TOKEN }}
          PAGES_ADMIN_TOKEN_2: ${{ secrets.GH_PAT }}
          PAGES_ADMIN_TOKEN_3: ${{ secrets.GITHUB_PAT }}
          PAGES_ADMIN_TOKEN_4: ${{ secrets.PAT }}
          PAGES_ADMIN_TOKEN_5: ${{ secrets.CODEX_GITHUB_TOKEN }}
          PAGES_ADMIN_TOKEN_6: ${{ secrets.GH_TOKEN }}
          PAGES_ADMIN_TOKEN_7: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token=""
          for candidate in             "$PAGES_ADMIN_TOKEN_1" "$PAGES_ADMIN_TOKEN_2" "$PAGES_ADMIN_TOKEN_3"             "$PAGES_ADMIN_TOKEN_4" "$PAGES_ADMIN_TOKEN_5" "$PAGES_ADMIN_TOKEN_6"             "$PAGES_ADMIN_TOKEN_7"; do
            if [ -n "$candidate" ]; then token="$candidate"; break; fi
          done
          test -n "$token" || {
            echo "No configured Pages administration token alias was visible to this workflow."
            exit 1
          }
          PAGES_ADMIN_TOKEN="$token" python3 tools/bootstrap_github_pages.py | tee pages-bootstrap.json
      - name: Upload bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-bootstrap
          path: pages-bootstrap.json
