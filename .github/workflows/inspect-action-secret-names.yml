name: Inspect Actions secret names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-action-secret-names.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret names only
        env:
          ACTION_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ.get("ACTION_SECRETS_JSON","{}"))
          print("ACTION_SECRET_NAMES_BEGIN")
          for key in sorted(data):
              print(key)
          print("ACTION_SECRET_NAMES_END")
          PY
