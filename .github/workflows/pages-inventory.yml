name: Audit GitHub Pages sites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/check_github_pages.py'
      - '.github/workflows/pages-inventory.yml'

permissions:
  contents: read

jobs:
  audit-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: GET Pages site for every public repository
        run: python3 tools/check_github_pages.py | tee pages-status.json
      - name: Publish summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("pages-status.json").read_text())
          c=d["counts"]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# GitHub Pages account audit\n\n")
              f.write(f"API: `GET /repos/{{owner}}/{{repo}}/pages` · version `{d['api_version']}`\n\n")
              f.write(f"Configured: **{c['configured']}** · Missing: **{c['missing']}** · Errors: **{c['errors']}** · Total: **{c['total']}**\n\n")
              f.write("| Repository | Pages | URL |\n|---|---:|---|\n")
              for r in d["repositories"]:
                  state="configured" if r["configured"] is True else ("missing" if r["configured"] is False else "error")
                  f.write(f"| {r['repository']} | {state} | {r.get('html_url') or ''} |\n")
          PY
      - name: Upload machine-readable audit
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-status
          path: pages-status.json
