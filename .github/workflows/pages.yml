name: Verify main hub and Dream public routes

on:
  push:
    branches: [main]
    paths:
      - 'docs/dream-to-action/**'
      - 'docs/index.html'
      - 'README.md'
      - 'tools/finalize_dream_publication.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-route-verification
  cancel-in-progress: true

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Materialize exact source
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify current hub / project / app topology
        run: python3 tools/finalize_dream_publication.py --check
      - name: Verify live public routes over HTTPS
        run: python3 tools/finalize_dream_publication.py --live
