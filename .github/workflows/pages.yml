name: Deploy public profile and Dream to Action

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/publish_dream_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify exact public app and announcement scope
        run: python3 tools/publish_dream_pages.py --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous public application and announcement pages
        run: python3 tools/publish_dream_pages.py --live
