name: Prepare Dream to Action public Pages projection
on:
  push:
    branches: [publish-dream-pages-20260928]
    paths:
      - 'tools/publish_dream_pages.py'
      - '.github/workflows/prepare-dream-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact authorized source branch
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Materialize only the tested app and additive announcements
        run: |
          set -euo pipefail
          python3 tools/publish_dream_pages.py --prepare
          python3 tools/publish_dream_pages.py --check
          python3 tools/redogit.py check .
          git diff --check
          git diff --stat
          python3 - <<'PY'
          import subprocess
          expected = {'README.md', 'docs/about.html', 'docs/recent-work.html'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          print('PASS: only requested profile/announcement content changed; all previous bytes are recoverable unchanged.')
          PY
      - name: Retain the checked publication candidate on staging only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/about.html docs/recent-work.html docs/dream-to-action/index.html docs/dream-to-action/SOURCE.json
          git commit -m 'Prepare pinned Dream to Action site and About Me announcements'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/publish-dream-pages-20260928
