name: Verify project-page source semantics

on:
  push:
    branches: [main]
    paths:
      - 'PROJECT_PAGES.json'
      - 'tools/check_project_source_semantics.py'
      - '.github/workflows/project-source-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-source-semantics
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify project pages against current sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_project_source_semantics.py
